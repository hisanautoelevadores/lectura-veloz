<!doctype html><html lang="es"><head><meta charset="utf-8">

<title>C · Azul índigo, fichas amarillas</title>
<style>
body{margin:0;background:#EAF0FA;color:#162A4D;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:20px 16px 40px}
h1{font-size:1.1rem;margin:0 0 14px}
.marco{position:relative;max-width:360px;margin:0 auto;padding:18px 14px;border-radius:18px;background:linear-gradient(180deg,#2E4F9A,#1B3470);border:3px solid #0F2350;box-shadow:0 14px 30px rgba(10,25,70,.5),inset 0 2px 0 rgba(255,255,255,.25)}
.cols{display:flex;justify-content:space-between;gap:6px}
.col{position:relative;width:52px;display:flex;flex-direction:column;align-items:center}
.cielo{position:relative;height:56px;width:100%}
.barra{width:100%;height:12px;margin:2px 0;background:#A9C1F0;border-radius:6px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.tierra{position:relative;height:160px;width:100%}
.ficha{position:absolute;left:50%;transform:translateX(-50%);width:40px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFF3A6 0%,#FFCC33 45%,#B38600 100%);box-shadow:0 4px 6px rgba(10,25,70,.5),inset -3px -4px 6px rgba(0,0,0,.25)}
.col::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:#A9C1F0;opacity:.7}
.fila{display:flex;justify-content:center;gap:10px;margin-top:14px;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;color:#FFCC33}
.pie{margin-top:16px;font-size:.9rem;line-height:1.45;opacity:.9}
.tag{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#FFCC33;color:#fff;font-weight:700;font-size:.8rem}
</style></head><body>
