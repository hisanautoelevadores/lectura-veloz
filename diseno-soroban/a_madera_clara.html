<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A · Madera clara, fichas rojas</title>
<style>
body{margin:0;background:#F4EEE3;color:#3B2A1A;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:20px 16px 40px}
h1{font-size:1.1rem;margin:0 0 14px}
.marco{position:relative;max-width:360px;margin:0 auto;padding:18px 14px;border-radius:18px;background:linear-gradient(180deg,#E9CFA4,#C99B5B);border:3px solid #8A5A2B;box-shadow:0 14px 30px rgba(90,30,15,.45),inset 0 2px 0 rgba(255,255,255,.25)}
.cols{display:flex;justify-content:space-between;gap:6px}
.col{position:relative;width:52px;display:flex;flex-direction:column;align-items:center}
.cielo{position:relative;height:56px;width:100%}
.barra{width:100%;height:12px;margin:2px 0;background:#6B4420;border-radius:6px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.tierra{position:relative;height:160px;width:100%}
.ficha{position:absolute;left:50%;transform:translateX(-50%);width:40px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FF8A7A 0%,#E0412F 45%,#8E1E12 100%);box-shadow:0 4px 6px rgba(90,30,15,.45),inset -3px -4px 6px rgba(0,0,0,.25)}
.col::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:#6B4420;opacity:.7}
.fila{display:flex;justify-content:center;gap:10px;margin-top:14px;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums;color:#E0412F}
.pie{margin-top:16px;font-size:.9rem;line-height:1.45;opacity:.9}
.tag{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:#E0412F;color:#fff;font-weight:700;font-size:.8rem}
</style></head><body>
<h1>A · Madera clara, fichas rojas</h1>
<div class="marco"><div class="cols"><div class="col"><div class="cielo"><div class="ficha" style="top:40px"></div></div><div class="barra"></div><div class="tierra"><div class="ficha" style="top:0px"></div><div class="ficha" style="top:34px"></div><div class="ficha" style="top:82px"></div><div class="ficha" style="top:116px"></div></div></div><div class="col"><div class="cielo"><div class="ficha" style="top:40px"></div></div><div class="barra"></div><div class="tierra"><div class="ficha" style="top:0px"></div><div class="ficha" style="top:34px"></div><div class="ficha" style="top:68px"></div><div class="ficha" style="top:102px"></div></div></div><div class="col"><div class="cielo"><div class="ficha" style="top:6px"></div></div><div class="barra"></div><div class="tierra"><div class="ficha" style="top:0px"></div><div class="ficha" style="top:34px"></div><div class="ficha" style="top:82px"></div><div class="ficha" style="top:116px"></div></div></div><div class="col"><div class="cielo"><div class="ficha" style="top:40px"></div></div><div class="barra"></div><div class="tierra"><div class="ficha" style="top:14px"></div><div class="ficha" style="top:48px"></div><div class="ficha" style="top:82px"></div><div class="ficha" style="top:116px"></div></div></div></div></div>
<div class="fila"><span>2</span><span>4</span><span>7</span><span>0</span></div>
<p class="pie">Abajo, el número que muestra el soroban. Cada columna tiene una ficha de arriba (vale 5) y cuatro de abajo (valen 1 cada una). Para el 7 se usa la de arriba (5) y dos de abajo.</p>
<span class="tag">Diseño de muestra</span>
</body></html>
