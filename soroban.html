<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFE8DA">
<title>Soroban</title>
<style>
:root{color-scheme:light}
body{margin:0;background:#EFE8DA;color:#3B2A1A;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:16px 16px 40px;min-height:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{color:#6B5A44;text-decoration:none;border:1px solid #C8B99E;border-radius:10px;padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;background:none;cursor:pointer;font:inherit}
h1{font-size:1.2rem;margin:0}
.marco{position:relative;margin:0 auto;border-radius:14px;background:linear-gradient(180deg,#2A2A2A,#101010);border:3px solid #050505;box-shadow:0 14px 30px rgba(40,25,10,.35);overflow:hidden;width:min(268px,92vw)}
.tablero{position:relative;height:200px;width:224px;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.marco-sup,.marco-inf{position:absolute;left:-14px;right:-14px;height:10px;background:linear-gradient(180deg,#1A1A1A,#050505);z-index:4}
.marco-sup{top:0}.marco-inf{bottom:0;height:10px}
.barra{position:absolute;left:-14px;right:-14px;top:60px;height:10px;background:linear-gradient(180deg,#EDE3CC,#B9AA86);box-shadow:0 3px 5px rgba(0,0,0,.35);z-index:2}
.punto{position:absolute;left:12.5%;top:62px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#FFF7E0;box-shadow:0 0 0 1px #5A3A1A,0 1px 2px rgba(0,0,0,.6);z-index:3}
.varilla{position:absolute;top:10px;bottom:10px;width:4px;margin-left:-2px;background:#E9DCC2;opacity:.9;border-radius:2px;z-index:1}
.cu{position:absolute;width:40px;height:26px;margin-left:-20px;z-index:3;cursor:pointer;transition:top .25s ease;-webkit-tap-highlight-color:transparent;touch-action:none}
.cu svg{display:block;width:40px;height:26px;pointer-events:none}
.cu:focus-visible{outline:3px solid #F2B300;outline-offset:2px;border-radius:6px}
.numero{display:flex;gap:3px;font-weight:700;font-size:1.6rem;color:#B5501F;font-variant-numeric:tabular-nums;min-width:4.5ch;justify-content:flex-start}
.numero span{min-width:1ch;text-align:center}
.numero span.cero{color:#B9A990}
.pista{text-align:center;color:#5A4A36;font-size:.95rem;line-height:1.45;min-height:2.9em}
.acciones{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;min-height:44px;padding:10px 16px;border-radius:10px;border:1.5px solid #6B5A44;background:transparent;color:#3B2A1A;cursor:pointer}
.btn.primary{background:#274A8C;border-color:#274A8C;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.nota{font-size:.85rem;color:#6B5A44;text-align:center}
.menu-ej{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menu-ej button{min-height:48px;border-radius:12px;border:2px solid #C8B99E;background:#FAF6EE;color:#3B2A1A;font:inherit;font-weight:600;cursor:pointer}
.menu-ej button[aria-pressed="true"]{background:#274A8C;border-color:#274A8C;color:#fff}
.ej-caja{background:#FAF6EE;border:1px solid #C8B99E;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ej-caja h2{margin:0;font-size:1.05rem}
.ej-caja .txt{font-size:1.05rem;line-height:1.45;min-height:2.9em}
.opc-num{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opc-num button{min-height:52px;border-radius:12px;border:2px solid #C8B99E;background:#fff;font:inherit;font-size:1.3rem;font-weight:700;cursor:pointer}
.opc-num button.ok{background:#2E8B57;border-color:#2E8B57;color:#fff}
.opc-num button.bad{background:#B03A28;border-color:#B03A28;color:#fff}
.ej-fila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fila-sob{display:flex;align-items:center;justify-content:center;gap:8px}
.fila-sob .marco{width:auto}
.contador{text-align:center;font-size:.9rem;color:#6B5A44;margin:0}
.leyenda{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.92rem;line-height:1.35}
.leyenda div{background:#fff;border:1px solid #C8B99E;border-radius:10px;padding:8px}
.leyenda b{font-size:1.2rem}
.etq{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#FF1E8C;font:800 14px system-ui,sans-serif;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff;pointer-events:none}
.tab-etq .cu.activo .etq{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← Inicio</a>
    <h1>Soroban</h1>
    <span></span>
  </div>

  <div class="menu-ej" role="group" aria-label="Ejercicios">
    <button type="button" data-ej="libre" aria-pressed="true">Explorar</button>
    <button type="button" data-ej="ficha" aria-pressed="false">1 · Qué vale cada ficha</button>
    <button type="button" data-ej="armar" aria-pressed="false">2 · Armar el número</button>
    <button type="button" data-ej="dictado" aria-pressed="false">Dictado</button>
    <button type="button" data-ej="leer" aria-pressed="false">3 · Leer el número</button>
    <button type="button" data-ej="llevada" aria-pressed="false">3 · Suma con llevada</button>
    <button type="button" data-ej="sumar" aria-pressed="false">4 · Cómo sumar</button>
    <button type="button" data-ej="restar" aria-pressed="false">5 · Cómo restar</button>
    <button type="button" data-ej="multi" aria-pressed="false">6 · Multiplicar (una cifra)</button>
  </div>

  <div class="fila-sob"><div class="marco"><div class="tablero" id="tab">
    <div class="marco-sup"></div><div class="marco-inf"></div>
    <div class="barra"></div><div class="punto"></div>
  </div></div>
  <div class="numero" id="num" aria-live="polite" aria-label="Número del soroban"></div></div>

  <div class="ej-caja" id="ejCaja" hidden></div>
  <p class="pista" id="pista"></p>

  <div class="acciones">
    <button class="btn" id="limpiar" type="button">Poner en cero</button>
  </div>
  <p class="nota">Tocá una ficha, o arrastrala hacia la barra para subirla y hacia afuera para bajarla. Las fichas de la barra (arriba) valen 5; las de abajo valen 1.</p>
</div>

<script>
(() => {
  const N = 4;                  // columnas (por ahora)
  const ALTO = 26, PASO = 22;
  const TOP_MARCO = 10, BARRA_TOP = 60, BARRA_BOTTOM = 70, MARCO_INF = 190;
  const PATH_ARR = 'M15 0 H29 L44 13 L0 13 Z';
  const PATH_ABA = 'M0 13 H44 L29 26 H15 Z';
  const tab = document.getElementById('tab');

  // estado: por columna, cielo (0/1) y tierra (0..4)
  const est = Array.from({ length: N }, () => ({ cielo: 0, tierra: 0 }));

  // degradados compartidos
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  defs.setAttribute('width', '0'); defs.setAttribute('height', '0');
  defs.style.position = 'absolute';
  defs.innerHTML = '<defs>' +
    '<linearGradient id="gArr" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFD0A0"/><stop offset=".6" stop-color="#F08A44"/><stop offset="1" stop-color="#C4601F"/></linearGradient>' +
    '<linearGradient id="gAba" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#C4601F"/><stop offset=".5" stop-color="#B0521A"/><stop offset="1" stop-color="#7A3510"/></linearGradient>' +
    '</defs>';
  tab.appendChild(defs);

  const cuentas = []; // {col, tipo:'cielo'|'tierra', idx, el}

  function svgCuenta() {
    return '<svg viewBox="0 0 44 26">' +
      `<path d="${PATH_ARR}" fill="url(#gArr)" stroke="#8A3E12" stroke-width=".6" stroke-linejoin="round"/>` +
      `<path d="${PATH_ABA}" fill="url(#gAba)" stroke="#6A2D0C" stroke-width=".6" stroke-linejoin="round"/>` +
      '<ellipse cx="22" cy="7" rx="9" ry="2.2" fill="#FFFFFF" opacity=".45"/>' +
      '<path d="M1 13 H43" stroke="#7A3510" stroke-width=".7" opacity=".6"/>' +
      '</svg>';
  }

  for (let c = 0; c < N; c++) {
    const left = (c + 0.5) / N * 100;
    const varilla = document.createElement('div');
    varilla.className = 'varilla'; varilla.style.left = left + '%';
    tab.appendChild(varilla);
    // cuenta superior
    const sup = crearCuenta(c, 'cielo', 0, left);
    // cuatro cuentas inferiores
    for (let j = 0; j < 4; j++) crearCuenta(c, 'tierra', j, left);
  }

  function crearCuenta(col, tipo, idx, left) {
    const el = document.createElement('div');
    el.className = 'cu';
    el.style.left = left + '%';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.innerHTML = svgCuenta() + '<span class="etq">' + (tipo === 'cielo' ? '5' : '1') + '</span>';
    // arrastre táctil y con mouse: subir o bajar la ficha; un toque sin arrastre la mueve igual
    let inicioY = null, arrastrado = false;
    el.addEventListener('pointerdown', (e) => { inicioY = e.clientY; arrastrado = false; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
    el.addEventListener('pointermove', (e) => {
      if (inicioY === null) return;
      const dy = e.clientY - inicioY;
      if (Math.abs(dy) > 6) arrastrado = true;
      const lim = 40;
      el.style.transform = 'translateY(' + Math.max(-lim, Math.min(lim, dy)) + 'px)';
    });
    const soltar = (e) => {
      if (inicioY === null) return;
      const dy = e.clientY - inicioY;
      inicioY = null;
      el.style.transform = '';
      el.style.transition = '';
      if (!arrastrado) { tocar(col, tipo, idx); return; }
      if (tipo === 'cielo') {
        if (dy > 12 && !est[col].cielo) tocar(col, tipo, idx);
        else if (dy < -12 && est[col].cielo) tocar(col, tipo, idx);
      } else {
        const activa = idx < est[col].tierra;
        if (dy < -12 && !activa) tocar(col, tipo, idx);
        else if (dy > 12 && activa) tocar(col, tipo, idx);
        else render();
      }
    };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', soltar);

    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocar(col, tipo, idx); } });
    tab.appendChild(el);
    cuentas.push({ col, tipo, idx, el });
    return el;
  }

  // posición vertical de cada cuenta según el estado
  function posiciones() {
    for (const c of cuentas) {
      const e = est[c.col];
      let top, activo;
      if (c.tipo === 'cielo') { activo = !!e.cielo; top = e.cielo ? BARRA_TOP - ALTO : TOP_MARCO; }
      else { activo = c.idx < e.tierra; top = activo ? BARRA_BOTTOM + c.idx * PASO - 2 : MARCO_INF - ALTO - (3 - c.idx) * PASO; }
      c.el.style.top = top + 'px';
      c.el.classList.toggle('activo', activo);
    }
  }

  let MODO = 'libre';   // libre | ficha | armar | leer
  let objetivo = null;  // para armar y leer
  function fijar(col, cielo, tierra) { est[col].cielo = cielo; est[col].tierra = tierra; }
  function soloUnidades(v) { est.forEach((e, c) => { e.cielo = 0; e.tierra = 0; }); const u = est[N - 1]; u.cielo = v >= 5 ? 1 : 0; u.tierra = v % 5; }

  function tocar(col, tipo, idx) {
    if (MODO === 'ficha' || MODO === 'leer') return;   // en estos ejercicios las fichas no se mueven a mano
    const e = est[col];
    if (tipo === 'cielo') {
      e.cielo = e.cielo ? 0 : 1;
    } else {
      // tocar una ficha inferior: si está activa, se bajan ella y las de debajo; si no, se suben hasta ella
      if (idx < e.tierra) e.tierra = idx;
      else e.tierra = idx + 1;
    }
    render();
  }

  function valor(col) { return est[col].cielo * 5 + est[col].tierra; }

  function render() {
    posiciones();
    const numEl = document.getElementById('num');
    numEl.innerHTML = '';
    let total = 0;
    for (let c = 0; c < N; c++) {
      const v = valor(c);
      total = total * 10 + v;
      const s = document.createElement('span');
      s.textContent = String(v);
      if (v === 0) s.className = 'cero';
      numEl.appendChild(s);
    }
    document.getElementById('pista').textContent =
      'Número: ' + total + '. ' + pistaDe();
  }

  function pistaDe() {
    // explicación breve del último movimiento en la columna de las unidades
    const e = est[N - 1];
    const v = e.cielo * 5 + e.tierra;
    if (v === 0) return 'Ninguna ficha activa en la columna de las unidades.';
    if (e.cielo && e.tierra) return 'En las unidades: la ficha de arriba (5) más ' + e.tierra + ' de abajo.';
    if (e.cielo) return 'En las unidades: solo la ficha de arriba (5).';
    return 'En las unidades: ' + e.tierra + (e.tierra === 1 ? ' ficha' : ' fichas') + ' de abajo (1 cada una).';
  }

  // ----- Ejercicios -----
  const caja = document.getElementById('ejCaja');
  const PASOS_FICHA = [
    { t: 'Esta es la columna de las unidades. Las fichas de abajo valen 1 cada una. La de arriba vale 5.', f: () => soloUnidades(0) },
    { t: 'Con el pulgar subí una ficha de abajo, hasta la barra. Vale 1.', f: () => soloUnidades(1) },
    { t: 'Subí otra con el pulgar. Ahora son 2.', f: () => soloUnidades(2) },
    { t: 'Una más: 3.', f: () => soloUnidades(3) },
    { t: 'Y la cuarta: 4. Las cuatro de abajo están pegadas a la barra.', f: () => soloUnidades(4) },
    { t: 'Para volver a cero, el pulgar empuja las de abajo hacia abajo.', f: () => soloUnidades(0) },
    { t: 'Ahora el índice baja la ficha de arriba hasta la barra. Vale 5, y aparece el 5 en la ficha.', f: () => soloUnidades(5) },
    { t: 'Con el 5 bajado, sumamos 3 más subiendo tres de abajo con el pulgar: 5 más 3 es 8.', f: () => soloUnidades(8) },
    { t: 'Con las cuatro de abajo: 5 más 4 es 9. Es el número más grande de una columna.', f: () => soloUnidades(9) },
    { t: 'Para mostrar 2, el índice sube la ficha de arriba (ya no vale nada) y el pulgar deja dos de abajo: 2.', f: () => soloUnidades(2) },
    { t: 'Ahora practicá: volvé a cero con el índice y el pulgar, y después probá el ejercicio 2.', f: () => soloUnidades(0) }
  ];
  let paso = 0;
  function ejFicha() {
    caja.hidden = false;
    caja.innerHTML = '';
    const h2 = document.createElement('h2'); h2.textContent = '1 · Qué vale cada ficha';
    const leyenda = document.createElement('div'); leyenda.className = 'leyenda';
    leyenda.innerHTML = '<div><b>☝️ Índice</b><br>Mueve la ficha de arriba: vale 5.</div><div><b>👍 Pulgar</b><br>Sube las de abajo: cada una vale 1.</div>';
    const t = document.createElement('p'); t.className = 'txt'; t.textContent = PASOS_FICHA[paso].t;
    const fila = document.createElement('div'); fila.className = 'ej-fila';
    const ant = document.createElement('button'); ant.type = 'button'; ant.className = 'btn';
    ant.textContent = '← Anterior'; ant.disabled = paso === 0;
    ant.onclick = () => { paso = Math.max(0, paso - 1); PASOS_FICHA[paso].f(); render(); ejFicha(); };
    const sig = document.createElement('button'); sig.type = 'button'; sig.className = 'btn primary';
    const ultimo = paso === PASOS_FICHA.length - 1;
    sig.textContent = ultimo ? 'Empezar de nuevo' : 'Siguiente →';
    sig.onclick = () => { paso = ultimo ? 0 : paso + 1; PASOS_FICHA[paso].f(); render(); ejFicha(); };
    fila.append(ant, sig);
    const cont = document.createElement('p'); cont.className = 'contador';
    cont.textContent = 'Paso ' + (paso + 1) + ' de ' + PASOS_FICHA.length;
    caja.append(h2, leyenda, t, fila, cont);
    document.getElementById('tab').classList.add('tab-etq');
    PASOS_FICHA[paso].f(); render();
  }
  // Niveles de números: 1 = hasta 9, 2 = hasta 99, 3 = hasta 999 (el soroban tiene 4 columnas).
  let NIVEL = 1;
  let reiniciar = null;   // vuelve a empezar el ejercicio actual (al cambiar de nivel)
  function rango() { return NIVEL === 1 ? [1, 9] : (NIVEL === 2 ? [10, 99] : [100, 999]); }
  function aleatorio() { const [lo, hi] = rango(); return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  // pone en las columnas las cifras de v, de la unidad hacia la izquierda
  function setValor(v) {
    for (let c = N - 1; c >= 0; c--) { const d = v % 10; est[c].cielo = d >= 5 ? 1 : 0; est[c].tierra = d % 5; v = Math.floor(v / 10); }
  }
  function totalDeColumnas() { let t = 0; for (let c = 0; c < N; c++) t = t * 10 + valor(c); return t; }
  function selectorNivel() {
    const f = document.createElement('div'); f.className = 'ej-fila';
    [[1, 'Hasta 9'], [2, 'Hasta 99'], [3, 'Hasta 999']].forEach(([n, t]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn';
      b.textContent = t; b.setAttribute('aria-pressed', String(NIVEL === n));
      if (NIVEL === n) b.classList.add('primary');
      b.onclick = () => { NIVEL = n; if (reiniciar) reiniciar(); };
      f.append(b);
    });
    return f;
  }
  function ejArmar() {
    reiniciar = ejArmar; caja.hidden = false;
    objetivo = aleatorio();
    setValor(0); render();
    caja.innerHTML = '';
    const h2 = document.createElement('h2'); h2.textContent = '2 · Armar el número';
    const t = document.createElement('p'); t.className = 'txt'; t.id = 'ejTxt';
    t.textContent = 'Mostrame el ' + objetivo + ' con las fichas.';
    const fila = document.createElement('div'); fila.className = 'ej-fila';
    const otro = document.createElement('button'); otro.type = 'button'; otro.className = 'btn';
    otro.textContent = 'Otro número'; otro.onclick = ejArmar;
    fila.append(otro);
    caja.append(h2, t, selectorNivel(), fila);
  }
  function ejDictado() {
    reiniciar = ejDictado; caja.hidden = false;
    objetivo = aleatorio();
    setValor(0); render();
    caja.innerHTML = '';
    const h2 = document.createElement('h2'); h2.textContent = 'Dictado';
    const t = document.createElement('p'); t.className = 'txt'; t.id = 'ejTxt';
    t.textContent = 'Escuchá el número y armalo con las fichas.';
    const fila = document.createElement('div'); fila.className = 'ej-fila';
    const escuchar = document.createElement('button'); escuchar.type = 'button'; escuchar.className = 'btn';
    escuchar.textContent = '🔊 Escuchar'; escuchar.onclick = () => decirNumero(objetivo);
    const otro = document.createElement('button'); otro.type = 'button'; otro.className = 'btn';
    otro.textContent = 'Otro número'; otro.onclick = ejDictado;
    fila.append(escuchar, otro);
    caja.append(h2, t, selectorNivel(), fila);
    setTimeout(() => { if (MODO === 'dictado' && objetivo !== null) decirNumero(objetivo); }, 300);
  }
  function decirNumero(n) {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(n)); u.lang = 'es-AR'; u.rate = .85;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function ejLeer() {
    reiniciar = ejLeer; caja.hidden = false;
    objetivo = NIVEL === 1 ? Math.floor(Math.random() * 10) : aleatorio();
    setValor(objetivo); render();
    caja.innerHTML = '';
    const h2 = document.createElement('h2'); h2.textContent = '3 · Leer el número';
    const t = document.createElement('p'); t.className = 'txt'; t.textContent = '¿Qué número muestra el soroban?';
    // opciones: el correcto y otros cercanos (±1, ±10) o al azar dentro del mismo nivel
    const [lo, hi] = NIVEL === 1 ? [0, 9] : rango();
    const ops = new Set([objetivo]);
    const cerca = shuffleArr([objetivo - 1, objetivo + 1, objetivo - 10, objetivo + 10].filter(x => x >= lo && x <= hi));
    while (ops.size < 5) ops.add(cerca.length ? cerca.shift() : lo + Math.floor(Math.random() * (hi - lo + 1)));
    const grilla = document.createElement('div'); grilla.className = 'opc-num';
    shuffleArr([...ops]).forEach(n => {
      const bt = document.createElement('button'); bt.type = 'button'; bt.textContent = String(n);
      bt.onclick = () => {
        if (n === objetivo) { bt.classList.add('ok'); t.textContent = '¡Muy bien! Es el ' + n + '.'; }
        else { bt.classList.add('bad'); t.textContent = 'No es ese. Mirá otra vez: cada ficha de abajo vale 1 y la de arriba vale 5, y cada columna de la izquierda vale diez veces más.'; }
      };
      grilla.append(bt);
    });
    const fila = document.createElement('div'); fila.className = 'ej-fila';
    const otro = document.createElement('button'); otro.type = 'button'; otro.className = 'btn';
    otro.textContent = 'Otro número'; otro.onclick = ejLeer;
    fila.append(otro);
    caja.append(h2, t, selectorNivel(), grilla, fila);
  }
  function setU(cielo, tierra) { est.forEach(e => { e.cielo = 0; e.tierra = 0; }); est[N - 1].cielo = cielo; est[N - 1].tierra = tierra; }
  // Suma dentro de una columna (resultado de 0 a 9). Si hace falta, se usa la ficha de arriba (5) y se quita lo que sobra.
  function pasosSumar(a, b) {
    const r = a + b, P = [];
    P.push({ t: 'Empezamos con ' + a + ' en la columna de las unidades.', f: () => soloUnidades(a) });
    if (a < 5 && r < 5) {
      for (let k = a + 1; k <= r; k++) P.push({ t: 'Con el pulgar subimos una ficha de abajo: ahora son ' + k + '.', f: () => setU(0, k) });
      P.push({ t: 'Listo: ' + a + ' más ' + b + ' es ' + r + '.', f: () => soloUnidades(r) });
    } else if (a < 5) {
      P.push({ t: 'Para sumar ' + b + ' conviene sumar 5 primero y después quitar lo que sobra. Con el índice bajamos la ficha de arriba: ahora vale ' + (5 + a) + '.', f: () => setU(1, a) });
      const quitar = 5 - b;
      for (let k = a - 1; k >= a - quitar; k--) P.push({ t: 'Ahora quitamos ' + (a - k) + ' de abajo, con el pulgar. Vamos a ' + (5 + k) + '.', f: () => setU(1, k) });
      P.push({ t: 'Listo: ' + a + ' más ' + b + ' es ' + r + '.', f: () => soloUnidades(r) });
    } else {
      P.push({ t: 'Como ya hay una ficha de arriba (5), sumamos ' + b + ' subiendo fichas de abajo.', f: () => setU(1, a - 5) });
      for (let k = a - 4; k <= r - 5; k++) P.push({ t: 'Subimos una más con el pulgar: ahora es ' + (5 + k) + '.', f: () => setU(1, k) });
      P.push({ t: 'Listo: ' + a + ' más ' + b + ' es ' + r + '.', f: () => soloUnidades(r) });
    }
    return P;
  }
  // Planifica la resta de un dígito d (1-9) sobre una varilla con valor V (0-9).
  // Reglas inversas: D directa · C complemento de 5 inverso · T complemento de 10 inverso · M mixto inverso.
  // Orden: primero se pide la decena (−10 a la izquierda), después se completa en esta varilla.
  // Devuelve pasos con delta: −10 (decena), ±5 (cielo) o ±1 (una cuenta de tierra).
  function planRestar(V, d) {
    const U = V >= 5 ? 5 : 0, L = V - U, S = [];
    // D · directa: se quitan las cuentas que forman el dígito
    if ((d <= 4 && L >= d) || (d === 5 && U === 5) || (d >= 6 && U === 5 && L >= d - 5)) {
      if (d >= 5 && U === 5) S.push({ delta: -5, t: 'Quitamos el cielo, que vale 5.' });
      const restan = d >= 5 ? d - 5 : d;
      for (let k = 1; k <= restan; k++) S.push({ delta: -1, t: 'Con el pulgar quitamos una de tierra.' });
      return { regla: 'D', pasos: S };
    }
    // C · complemento de 5 inverso: se quita el cielo y se agregan las de tierra que faltan
    if (d <= 4 && U === 5 && L < d) {
      S.push({ delta: -5, t: 'Quitamos el cielo, que vale 5.' });
      for (let k = 1; k <= 5 - d; k++) S.push({ delta: +1, t: 'Con el pulgar subimos una de tierra.' });
      return { regla: 'C', pasos: S };
    }
    if (V >= d) throw new Error('sin regla para V=' + V + ' d=' + d);
    // hace falta pedir una decena a la izquierda
    const c = 10 - d;
    const sumable = (c <= 4 && 4 - L >= c) || (c === 5 && U === 0) || (c >= 6 && U === 0 && 4 - L >= c - 5);
    S.push({ delta: -10, t: 'Pedimos 1 de las decenas: en esta columna hay que completar 10.' });
    if (sumable) {
      // T · complemento de 10 inverso: se suma c = 10 − d en esta varilla
      if (c === 5) S.push({ delta: +5, t: 'Bajamos el cielo, que vale 5.' });
      else if (c <= 4) for (let k = 1; k <= c; k++) S.push({ delta: +1, t: 'Con el pulgar subimos una de tierra.' });
      else { S.push({ delta: +5, t: 'Bajamos el cielo, que vale 5.' }); for (let k = 1; k <= c - 5; k++) S.push({ delta: +1, t: 'Con el pulgar subimos una de tierra.' }); }
      return { regla: 'T', pasos: S };
    }
    // M · mixto inverso: d de 6 a 9, sin cielo y con tierras suficientes
    if (d >= 6 && U === 0 && L >= d - 5) {
      S.push({ delta: +5, t: 'Bajamos el cielo, que vale 5.' });
      for (let k = 1; k <= d - 5; k++) S.push({ delta: -1, t: 'Con el pulgar quitamos una de tierra.' });
      return { regla: 'M', pasos: S };
    }
    throw new Error('sin regla de préstamo para V=' + V + ' d=' + d);
  }

  // Resta: el ábaco sigue la tabla de resta (D, C, T, M); el paso de pedir decena va primero.
  function pasosRestarTabla(X, d) {
    const P = [{ t: 'Empezamos con ' + X + '.', f: () => setValor(X) }];
    let cur = X;
    planRestar(X % 10, d).pasos.forEach(p => { cur += p.delta; const v = cur; P.push({ t: p.t, f: () => setValor(v) }); });
    P.push({ t: 'Listo: ' + X + ' menos ' + d + ' es ' + (X - d) + '.', f: () => setValor(X - d) });
    return P;
  }
  let RESTA_PASO = 1;
  function selectorRestaPaso() {
    const f = document.createElement('div'); f.className = 'ej-fila';
    [[1, 'Sin pedir decena'], [2, 'Pidiendo decena']].forEach(([n, t]) => {
      const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn';
      bt.textContent = t; bt.setAttribute('aria-pressed', String(RESTA_PASO === n));
      if (RESTA_PASO === n) bt.classList.add('primary');
      bt.onclick = () => { RESTA_PASO = n; ejRestar(); };
      f.append(bt);
    });
    return f;
  }
  // Muestra una secuencia de pasos con Anterior / Siguiente, y un ejemplo nuevo.
  let seq = null, seqPaso = 0, seqTitulo = '', seqNuevo = null;
  function mostrarSeq() {
    caja.hidden = false; caja.innerHTML = '';
    const h2 = document.createElement('h2'); h2.textContent = seqTitulo;
    const leyenda = document.createElement('div'); leyenda.className = 'leyenda';
    leyenda.innerHTML = '<div><b>☝️ Índice</b><br>Mueve la ficha de arriba: vale 5.</div><div><b>👍 Pulgar</b><br>Sube o baja las de abajo: cada una vale 1.</div>';
    const t = document.createElement('p'); t.className = 'txt'; t.textContent = seq[seqPaso].t;
    const fila = document.createElement('div'); fila.className = 'ej-fila';
    const ant = document.createElement('button'); ant.type = 'button'; ant.className = 'btn'; ant.textContent = '← Anterior'; ant.disabled = seqPaso === 0;
    ant.onclick = () => { seqPaso = Math.max(0, seqPaso - 1); seq[seqPaso].f(); render(); mostrarSeq(); };
    const ultimo = seqPaso === seq.length - 1;
    const sig = document.createElement('button'); sig.type = 'button'; sig.className = 'btn primary';
    sig.textContent = ultimo ? 'Otro ejemplo' : 'Siguiente →';
    sig.onclick = () => { if (ultimo) { seqNuevo(); return; } seqPaso++; seq[seqPaso].f(); render(); mostrarSeq(); };
    fila.append(ant, sig);
    const cont = document.createElement('p'); cont.className = 'contador'; cont.textContent = 'Paso ' + (seqPaso + 1) + ' de ' + seq.length;
    caja.append(h2);
    if (seqExtra) caja.append(seqExtra());
    caja.append(leyenda, t, fila, cont);
    document.getElementById('tab').classList.add('tab-etq');
    seq[seqPaso].f(); render();
  }
  // Suma con llevada: paso 1 = sin pasar de 10 (1 + 3); paso 2 = suma de 5 o más, con el método de complemento:
  // para sumar b se suma 10 y se quita lo que sobra (10 - b). Ejemplo: 6 + 6 = 6 + 10 - 4.
  let SUMA_PASO = 1, seqExtra = null;
  // Planifica la suma de un dígito d (1-9) sobre una varilla con valor V (0-9).
  // Reglas: D directa · C complemento de 5 · T complemento de 10 simple · M mixto (10 y 5).
  // Orden: primero se quita lo que haga falta en esta varilla, después se lleva 1 a la izquierda.
  function planSumar(V, d) {
    const U = V >= 5 ? 5 : 0, L = V - U, r = V + d, S = [];
    // D · directa: alcanza sin complementos
    if ((d <= 4 && 4 - L >= d) || (d === 5 && U === 0) || (d >= 6 && U === 0 && 4 - L >= d - 5)) {
      let n = V;
      if (d >= 5 && U === 0) { n += 5; S.push({ t: 'Bajamos el cielo, que vale 5: ahora es ' + n + '.', n }); }
      const restan = d >= 5 ? d - 5 : d;
      for (let k = 1; k <= restan; k++) { n++; S.push({ t: 'Con el pulgar subimos una de tierra: ahora es ' + n + '.', n }); }
      return { regla: 'D', pasos: S };
    }
    // C · complemento de 5: se activa el cielo y se quitan las de tierra que sobran
    if (d <= 4 && U === 0 && L + d >= 5) {
      const n5 = V + 5;
      S.push({ t: 'Bajamos el cielo, que vale 5: ahora es ' + n5 + '.', n: n5 });
      for (let k = 1; k <= 5 - d; k++) S.push({ t: 'Quitamos una de tierra: ahora es ' + (n5 - k) + '.', n: n5 - k });
      return { regla: 'C', pasos: S };
    }
    const c = 10 - d;
    const removible = (c <= 4 && L >= c) || (c === 5 && U === 5) || (c >= 6 && U === 5 && L >= c - 5);
    // T · complemento de 10 simple: se quita c = 10 - d en esta varilla y se lleva 1
    if (r >= 10 && removible) {
      let n = V;
      if (c === 5) { n = V - 5; S.push({ t: 'Subimos el cielo, que quita 5: ahora es ' + n + '.', n }); }
      else if (c <= 4) { for (let k = 1; k <= c; k++) { n--; S.push({ t: 'Quitamos una de tierra con el pulgar: ahora es ' + n + '.', n }); } }
      else { n = V - 5; S.push({ t: 'Subimos el cielo, que quita 5: ahora es ' + n + '.', n }); for (let k = 1; k <= c - 5; k++) { n--; S.push({ t: 'Quitamos una de tierra con el pulgar: ahora es ' + n + '.', n }); } }
      S.push({ t: 'Llevamos 1 a las decenas: ahora es ' + (n + 10) + '.', n: n + 10 });
      return { regla: 'T', pasos: S };
    }
    // M · mixto: d de 6 a 9, con el cielo activo y pocas de tierra
    if (r >= 10 && d >= 6 && U === 5 && L < 10 - d) {
      let n = V - 5;
      S.push({ t: 'Subimos el cielo, que quita 5: ahora es ' + n + '.', n });
      for (let k = 1; k <= d - 5; k++) { n++; S.push({ t: 'Con el pulgar bajamos una de tierra: ahora es ' + n + '.', n }); }
      S.push({ t: 'Llevamos 1 a las decenas: ahora es ' + (n + 10) + '.', n: n + 10 });
      return { regla: 'M', pasos: S };
    }
    throw new Error('sin regla para V=' + V + ' d=' + d);
  }

  // Suma de un dígito con llevada: se sigue la regla de la tabla (T o M) con los movimientos reales del ábaco.
  function pasosLlevada(a, b) {
    const r = a + b;
    if (r <= 9) return pasosSumar(a, b);
    const P = [{ t: 'Empezamos con ' + a + ' en la columna de las unidades.', f: () => setValor(a) }];
    planSumar(a, b).pasos.forEach(p => P.push({ t: p.t, f: () => setValor(p.n) }));
    P.push({ t: 'Listo: ' + a + ' más ' + b + ' es ' + r + '.', f: () => setValor(r) });
    return P;
  }
  function selectorPaso() {
    const f = document.createElement('div'); f.className = 'ej-fila';
    [[1, 'Sin pasar de 10'], [2, 'Con llevada']].forEach(([n, t]) => {
      const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn';
      bt.textContent = t; bt.setAttribute('aria-pressed', String(SUMA_PASO === n));
      if (SUMA_PASO === n) bt.classList.add('primary');
      bt.onclick = () => { SUMA_PASO = n; ejLlevada(); };
      f.append(bt);
    });
    return f;
  }
  function ejLlevada() {
    seqTitulo = '3 · Suma con llevada';
    seqExtra = selectorPaso;
    seqNuevo = () => {
      let a, b;
      if (SUMA_PASO === 1) { a = 1 + Math.floor(Math.random() * 8); b = 1 + Math.floor(Math.random() * (9 - a)); }
      else { a = 1 + Math.floor(Math.random() * 8); const lo = Math.max(1, 10 - a); b = lo + Math.floor(Math.random() * (9 - lo + 1)); }
      seq = pasosLlevada(a, b); seqPaso = 0; mostrarSeq();
    };
    seqNuevo();
  }
  function ejSumar() {
    seqExtra = null;
    seqTitulo = '4 · Cómo sumar';
    seqNuevo = () => { const a = 1 + Math.floor(Math.random() * 8); const b = 1 + Math.floor(Math.random() * (9 - a)); seq = pasosSumar(a, b); seqPaso = 0; mostrarSeq(); };
    seqNuevo();
  }
  // Multiplicación con una cifra por una cifra, con los dos factores a la vista (両置き).
  // Las dos primeras varillas muestran los factores; las dos de la derecha, el producto (decenas y unidades).
  function setDigitos(arr) {
    for (let c = 0; c < N; c++) { const d = arr[c]; est[c].cielo = d >= 5 ? 1 : 0; est[c].tierra = d % 5; }
    render();
  }
  function pasosMulti(a, b) {
    const p = a * b, dec = Math.floor(p / 10), uni = p % 10, P = [];
    P.push({ t: 'Ponemos los dos factores en las primeras columnas: el ' + a + ' y el ' + b + '.', f: () => setDigitos([a, b, 0, 0]) });
    P.push({ t: a + ' × ' + b + ' = ' + p + '. Miramos la tabla de multiplicar. Ponemos las decenas: ' + dec + (dec === 0 ? ' (no hay decenas).' : '.'), f: () => setDigitos([a, b, dec, 0]) });
    P.push({ t: 'Ponemos las unidades: ' + uni + '.', f: () => setDigitos([a, b, dec, uni]) });
    P.push({ t: 'Listo: ' + a + ' × ' + b + ' = ' + p + '.', f: () => setDigitos([a, b, dec, uni]) });
    return P;
  }
  function ejMulti() {
    seqExtra = null;
    seqTitulo = '6 · Multiplicar (una cifra)';
    seqNuevo = () => { const a = 1 + Math.floor(Math.random() * 9), b = 1 + Math.floor(Math.random() * 9); seq = pasosMulti(a, b); seqPaso = 0; mostrarSeq(); };
    seqNuevo();
  }
  function ejRestar() {
    seqExtra = selectorRestaPaso;
    seqTitulo = '5 · Cómo restar';
    seqNuevo = () => {
      let X, d;
      if (RESTA_PASO === 1) { X = 1 + Math.floor(Math.random() * 9); d = 1 + Math.floor(Math.random() * X); }
      else { const a = Math.floor(Math.random() * 9); X = 10 + a; d = a + 1 + Math.floor(Math.random() * (9 - a)); }
      seq = pasosRestarTabla(X, d); seqPaso = 0; mostrarSeq();
    };
    seqNuevo();
  }
  function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function setModo(m) {
    MODO = m;
    document.querySelectorAll('.menu-ej button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ej === m)));
    document.getElementById('tab').classList.toggle('tab-etq', m === 'ficha');
    if (m === 'libre') { caja.hidden = true; render(); return; }
    if (m === 'ficha') { paso = 0; ejFicha(); }
    if (m === 'armar') { ejArmar(); }
    if (m === 'leer') { ejLeer(); }
    if (m === 'dictado') { ejDictado(); }
    if (m === 'llevada') { ejLlevada(); }
    if (m === 'sumar') { ejSumar(); }
    if (m === 'restar') { ejRestar(); }
    if (m === 'multi') { ejMulti(); }
  }
  document.querySelectorAll('.menu-ej button').forEach(b => b.addEventListener('click', () => setModo(b.dataset.ej)));
  // en "armar" se revisa cada vez que se mueve una ficha
  const _render = render;
  render = function () {
    _render();
    if ((MODO === 'armar' || MODO === 'dictado') && objetivo !== null && totalDeColumnas() === objetivo) {
      const t = document.getElementById('ejTxt');
      if (t && !t.dataset.ok) {
        t.dataset.ok = '1'; t.textContent = '¡Muy bien! Ese es el ' + objetivo + '.';
        setTimeout(() => { if (MODO === 'armar') ejArmar(); else if (MODO === 'dictado') ejDictado(); }, 1200);
      }
    }
  };

  document.getElementById('limpiar').addEventListener('click', () => {
    est.forEach(e => { e.cielo = 0; e.tierra = 0; });
    render();
  });

  render();
})();
</script>
